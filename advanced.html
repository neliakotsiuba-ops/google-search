<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Advanced Search</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="top-nav">
      <a href="index.html">Google Search</a>
      <a href="images.html">Images</a>
    </header>
    <main class="advanced-wrapper">
      <h2>Advanced Search</h2>
      <form action="https://www.google.com/search" method="get" class="advanced-form">
        <div class="row">
          <label>Find pages with… "all these words":</label>
          <input type="text" name="as_q">
        </div>
        <div class="row">
          <label>Find pages with… "this exact word or phrase":</label>
          <input type="text" name="as_epq">
        </div>
        <div class="row">
          <label>Find pages with… "any of these words":</label>
          <input type="text" name="as_oq">
        </div>
        <div class="row">
          <label>Find pages with… "none of these words":</label>
          <input type="text" name="as_eq">
        </div>
        <div class="row row-submit">
          <span></span>
          <input type="submit" value="Advanced Search" class="btn btn-advanced">
        </div>
      </form>
    </main>
  </body>
</html>
